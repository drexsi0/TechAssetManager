name: .NET

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-test-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore GerenciadorAtivosSolution.slnx

      - name: Build
        run: dotnet build GerenciadorAtivosSolution.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GerenciadorAtivosSolution.slnx --configuration Release --no-build

      - name: Vulnerability audit
        run: dotnet list GerenciadorAtivos/GerenciadorAtivos.csproj package --vulnerable --include-transitive
